name: VisaWatch Website Validation

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "client-guide.html"
      - "country-rules-review.html"
      - "dubai-budget.html"
      - "country-budget.html"
      - "training.html"
      - "worker.js"
      - "supabase-course-records.js"
      - "data/**"
      - "monitor.py"
      - "wrangler.jsonc"
      - ".assetsignore"
      - ".github/workflows/website-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON files and required sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          sources = json.loads(Path("data/sources.json").read_text(encoding="utf-8"))
          updates = json.loads(Path("data/updates.json").read_text(encoding="utf-8"))
          state = json.loads(Path("data/monitor_state.json").read_text(encoding="utf-8"))
          assert isinstance(sources.get("sources"), list), "data/sources.json must contain a sources list"
          assert len(sources["sources"]) >= 8, f"Expected at least 8 official monitoring sources, got {len(sources['sources'])}"
          assert all(s.get("country") and s.get("name") and s.get("url", "").startswith("https://") for s in sources["sources"]), "Each source needs a country, name, and HTTPS URL"
          assert updates.get("generated_at"), "data/updates.json is missing generated_at"
          assert isinstance(updates.get("items"), list) and 0 < len(updates["items"]) <= len(sources["sources"]), "Monitor results must be a non-empty list no larger than the configured source list"
          assert all(i.get("country") and i.get("status") and i.get("url", "").startswith("https://") for i in updates["items"]), "Each monitor result needs a country, status, and HTTPS URL"
          assert isinstance(state, dict), "data/monitor_state.json must be a JSON object"
          print(f"PASS: JSON valid; {len(sources['sources'])} configured sources and {len(updates['items'])} current monitor results.")
          print("Monitor generated_at:", updates["generated_at"])
          print("Review required for:", ", ".join(i["country"] for i in updates["items"] if i.get("status") != "reachable") or "none")
          PY

      - name: Validate monitor Python syntax
        run: python -m py_compile monitor.py

      - name: Validate inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for page in ["index.html", "client-guide.html", "country-rules-review.html", "dubai-budget.html", "country-budget.html", "training.html"]:
              html = Path(page).read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, flags=re.I)
              output = Path("/tmp") / (page.replace(".html", "-inline.js"))
              output.write_text("\n;\n".join(scripts), encoding="utf-8")
              if scripts:
                  print("Extracted " + str(len(scripts)) + " script block(s) from " + page)
              else:
                  print("PASS: " + page + " is a static page with no inline JavaScript.")
          PY
          for page in index client-guide country-rules-review dubai-budget country-budget training; do node --check "/tmp/$page-inline.js"; done
      - name: Validate website data paths and safety labels
        run: |
          python - <<'PY'
          from pathlib import Path

          import re
          html = Path("index.html").read_text(encoding="utf-8")
          assert "fetch('./data/sources.json'" in html, "Website must load the deployed sources JSON"
          assert "fetch('./data/updates.json'" in html, "Website must load the deployed updates JSON"
          assert "Detection is not confirmation" in html, "Required monitoring disclaimer is missing"
          assert "Pending human review" in html, "Human-review status language is missing"
          assert "raw.githubusercontent.com/supunchandimal08-cell/visa-watch/main/data/updates.json" not in html, "Website still depends on GitHub raw JSON"
          source_ids = re.findall(r'\{id:"([^"]+)"', html)
          assert len(source_ids) == len(set(source_ids)), "Official source IDs must be unique"
          rule_sources = re.findall(r'\{topic:[\s\S]*?\}', html)
          rule_source_ids = {source_id for block in rule_sources for source_id in re.findall(r'source:"([^"]+)"', block)}
          missing_sources = rule_source_ids - set(source_ids)
          assert not missing_sources, f"Rules reference missing official source IDs: {sorted(missing_sources)}"
          print(f"PASS: website data paths and review disclaimers are present; {len(source_ids)} unique source IDs; all rule source IDs resolve.")
          PY

      - name: Validate client assessment and document checklist
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              'id="caRef"',
              'id="caAge"',
              'id="clientDocumentTracker"',
              'id="dtFollowDate"',
              'id="dtFollowNote"',
              'data-doc-status',
              'id="dtCopy"',
              'Form data stays in this open page; it is not sent to a server.'
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Missing client assessment/checklist fields: " + ", ".join(missing))
          print("PASS: client reference, age range, document checklist, follow-up fields and privacy notice are present.")
          PY

      - name: Validate course records integration JavaScript
        run: node --check supabase-course-records.js


      - name: Validate client guide and Dubai budget calculator
        run: |
          python - <<'PY'
          from pathlib import Path
          guide = Path("client-guide.html").read_text(encoding="utf-8")
          budget = Path("dubai-budget.html").read_text(encoding="utf-8")
          guide_required = [
              "Plan your study abroad journey",
              "United Kingdom", "Canada", "Australia", "Dubai",
              "New Zealand", "Schengen", "United States",
              "visa approval", "part-time", "official"
          ]
          missing = [item for item in guide_required if item.casefold() not in guide.casefold()]
          if missing:
              raise SystemExit("Client guide is missing required guidance: " + ", ".join(missing))
          if not any(0x0D80 <= ord(char) <= 0x0DFF for char in guide):
              raise SystemExit("Client guide Sinhala language content is missing")
          budget_required = [
              'id="ref"', 'id="age"', 'id="budget"', 'id="rate"',
              'id="tuition"', 'id="visa"', 'id="housing"', 'id="living"',
              'id="sponsor"', 'id="verified"', 'id="gap"',
              "Dubai Student Budget Calculator"
          ]
          missing = [item for item in budget_required if item not in budget]
          if missing:
              raise SystemExit("Dubai budget calculator is missing required fields: " + ", ".join(missing))
          if "future employment income" not in budget:
              raise SystemExit("Budget calculator must warn against relying on future employment income")
          for field in ["budget", "rate", "tuition", "visa", "housing", "living", "other", "sponsor"]:
              if not __import__("re").search(r'id="' + field + r'"[^>]*value=""', budget):
                  raise SystemExit("Dubai budget field must not use an unverified pre-filled estimate: " + field)
          if 'value="1500000"' in budget or 'value="38400"' in budget:
              raise SystemExit("Dubai calculator contains old sample amounts")
          dashboard = Path("index.html").read_text(encoding="utf-8")
          if "CHECKLIST_STORAGE_KEY" not in dashboard:
              raise SystemExit("Counsellor checklist progress must persist locally")
          for field in ["bcBudgetLkr", "bcRate", "bcTuition", "bcVisa", "bcRent", "bcLiving", "bcArrival", "bcScholarship", "bcReserve"]:
              if not __import__("re").search(r'id="' + field + r'"[^>]*value=""', dashboard):
                  raise SystemExit("Client assessment budget field must not use an unverified pre-filled estimate: " + field)
          print("PASS: client guide, quote-based budget tools and persistent counsellor checklist are present.")
          PY

      - name: Validate international student budget calculator
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("country-budget.html").read_text(encoding="utf-8")
          required = [
              "International Student Budget Calculator",
              "United Kingdom",
              "Canada",
              "Australia",
              "New Zealand",
              "Germany",
              "United States",
              "United Arab Emirates",
              "Japan",
              "South Korea",
              "Malaysia",
              "South Africa",
              "Türkiye",
              "LKR per 1 local currency unit",
              "Sponsor funds and supporting evidence have been checked",
              "Do not count expected part-time earnings",
              "does not state or calculate an immigration authority's required financial evidence"
          ]
          missing = [item for item in required if item.casefold() not in html.casefold()]
          if missing:
              raise SystemExit("International budget calculator is missing safeguards or destinations: " + ", ".join(missing))
          if "United Arab Emirates" not in html or "Other destination" not in html:
              raise SystemExit("International budget calculator must support UAE and a manual fallback for unlisted countries")
          for required in ['id="otherCountry"', 'id="otherCountryField"', 'Bulgaria:"EUR"']:
              if required not in html:
                  raise SystemExit("International budget calculator is missing verified country/currency handling: " + required)
          if "!country-budget.html" not in Path(".assetsignore").read_text(encoding="utf-8"):
              raise SystemExit("International budget calculator is not included in Cloudflare static assets")
          if "country-budget.html" not in Path("index.html").read_text(encoding="utf-8"):
              raise SystemExit("International budget calculator is not linked from the dashboard")
          print("PASS: international budget calculator, country coverage, safeguards and deployment allowlist.")
          PY

      - name: Validate counsellor training page
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("training.html").read_text(encoding="utf-8")
          for required in ["Student Visa Counselling Foundations", "Knowledge check", "GDRFA", "Detection is not confirmation"]:
              if required.casefold() not in html.casefold():
                  raise SystemExit(f"Training page is missing required content: {required}")
          print("PASS: counsellor training page and safety guidance are present.")
          PY

      - name: Validate Cloudflare Worker entry point
        run: |
          node --check worker.js
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("wrangler.jsonc").read_text(encoding="utf-8"))
          assert config.get("main") == "./worker.js", "Wrangler main must point to worker.js"
          assert config.get("assets", {}).get("directory") == ".", "Static assets directory must be repository root"
          assert config.get("assets", {}).get("binding") == "ASSETS", "Static assets binding must be ASSETS"
          worker = Path("worker.js").read_text(encoding="utf-8")
          assert "env.ASSETS.fetch(request)" in worker, "Worker must forward requests to static assets"
          print("PASS: Cloudflare Worker entry point and static asset binding are configured.")
          PY

      - name: Validate country rules review and official references
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("country-rules-review.html").read_text(encoding="utf-8")
          required = [
              "Country Rules Review",
              "GDRFA Dubai",
              "AED 200",
              "AED 500",
              "Schengen",
              "long-stay",
              "German Embassy Colombo",
              "not a universal all-in student budget",
              "No visa, job or work-rights guarantee"
          ]
          missing = [item for item in required if item.casefold() not in html.casefold()]
          if missing:
              raise SystemExit("Country rules review is missing required accuracy guidance: " + ", ".join(missing))
          for url in [
              "https://gdrfad.gov.ae/",
              "https://u.ae/",
              "https://education.ec.europa.eu/",
              "https://colombo.diplo.de/"
          ]:
              if url not in html:
                  raise SystemExit("Missing official authority reference: " + url)
          australia_required = [
              "AUSTRALIA",
              "48 hours per fortnight",
              "condition 8105",
              "2 October 2026",
              "F2026L01347"
          ]
          missing = [item for item in australia_required if item.casefold() not in html.casefold()]
          if missing:
              raise SystemExit("Australia rules review is missing required safeguards: " + ", ".join(missing))
          registry = Path("data/sources.json").read_text(encoding="utf-8")
          if "see-your-visa-conditions?cno=8105" not in registry:
              raise SystemExit("Official Australian student work-condition source is missing from monitoring registry")
          canada_required = [
              "CANADA",
              "CAD 23,448",
              "24 hours per week",
              "without working in Canada",
              "financial-support.html",
              "work-off-campus.html"
          ]
          missing = [item for item in canada_required if item.casefold() not in html.casefold()]
          if missing:
              raise SystemExit("Canada rules review is missing current official safeguards: " + ", ".join(missing))
          nz_required = [
              "NEW ZEALAND",
              "25 hours per week",
              "3 November 2025",
              "working-on-a-student-visa"
          ]
          missing = [item for item in nz_required if item.casefold() not in html.casefold()]
          if missing:
              raise SystemExit("New Zealand rules review is missing official student work guidance: " + ", ".join(missing))
          germany_required = [
              "140 full days",
              "280 half days",
              "EUR 11,904"
          ]
          missing = [item for item in germany_required if item.casefold() not in html.casefold()]
          if missing:
              raise SystemExit("Germany rules review is missing current funds/work guidance: " + ", ".join(missing))
          registry_data = __import__("json").loads(Path("data/sources.json").read_text(encoding="utf-8"))
          registry_urls = {item.get("url") for item in registry_data.get("sources", [])}
          for url in [
              "https://www.canada.ca/en/immigration-refugees-citizenship/services/study-canada/work/work-off-campus.html",
              "https://www.canada.ca/en/immigration-refugees-citizenship/services/study-canada/study-permit/get-documents/financial-support.html",
              "https://www.immigration.govt.nz/study/once-you-have-a-student-visa/working-on-a-student-visa/",
              "https://www.make-it-in-germany.com/en/visa-recognition/visa-types/studying"
          ]:
              if url not in registry_urls:
                  raise SystemExit("Missing expanded official monitoring source: " + url)
          print("PASS: UAE, Australia, Canada, Germany, New Zealand and Europe guidance plus official monitoring sources are present.")
          PY
