
name: VisaWatch Daily Monitoring

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare monitoring files
        run: |
          mkdir -p data
          if [ ! -f data/monitor_state.json ]; then
            echo '{}' > data/monitor_state.json
          fi
          if [ ! -f data/updates.json ]; then
            echo '{"generated_at":null,"items":[],"monitor_errors":[]}' > data/updates.json
          fi

      - name: Diagnose Canada official page connectivity
        continue-on-error: true
        run: |
          python - <<'PY'
          import time
          import urllib.request
          import urllib.error

          urls = [
              "https://www.canada.ca/en/immigration-refugees-citizenship/services/study-canada/study-permit.html",
              "https://www.canada.ca/",
          ]
          for url in urls:
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "VisaWatch-monitor-diagnostic/1.0"}
              )
              started = time.monotonic()
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      print(f"OK status={response.status} elapsed={time.monotonic()-started:.1f}s url={url}")
              except urllib.error.HTTPError as error:
                  print(f"HTTP_ERROR status={error.code} elapsed={time.monotonic()-started:.1f}s url={url}")
              except Exception as error:
                  print(f"CONNECTION_ERROR type={type(error).__name__} elapsed={time.monotonic()-started:.1f}s url={url} detail={error}")
          PY

      - name: Run VisaWatch monitor
        run: |
          if [ -f scripts/monitor.py ]; then
            python scripts/monitor.py
          elif [ -f monitor.py ]; then
            python monitor.py
          else
            echo "ERROR: monitor.py not found"
            exit 1
          fi

      - name: Verify monitoring output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/updates.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          items = data.get("items")
          if not data.get("generated_at") or not isinstance(items, list) or not items:
              raise SystemExit("ERROR: monitoring output is empty or missing")
          print(f"Validated {len(items)} source results.")
          print(f"Generated at: {data['generated_at']}")
          PY

      - name: Commit monitoring results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitor_state.json data/updates.json monitor_state.json updates.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update VisaWatch monitoring results"
            git push
          else
            echo "No monitoring file changes to commit."
          fi
