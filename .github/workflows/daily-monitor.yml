      - name: Run VisaWatch monitor
name: VisaWatch Daily Monitoring

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run VisaWatch monitor
        run: |
          if [ -f scripts/monitor.py ]; then
            python scripts/monitor.py
          elif [ -f monitor.py ]; then
            python monitor.py
          else
            echo "ERROR: monitor.py not found"
            exit 1
          fi

      - name: Commit monitoring results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitor_state.json data/updates.json monitor_state.json updates.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update VisaWatch monitoring results"
            git push
          else
            echo "No monitoring file changes to commit."
          fi
