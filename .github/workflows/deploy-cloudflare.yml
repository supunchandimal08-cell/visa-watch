name: VisaWatch Cloudflare Deploy

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "client-guide.html"
      - "country-rules-review.html"
      - "dubai-budget.html"
      - "training.html"
      - "worker.js"
      - "supabase-course-records.js"
      - "data/**"
      - "wrangler.jsonc"
      - ".assetsignore"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visawatch-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check deployment secrets are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy static assets to Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy ./worker.js

      - name: Verify live deployment
        run: |
          set -euo pipefail
          BASE="https://visa-watch.supunchandimal08.workers.dev"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors "$BASE/" -o /tmp/home.html
          grep -Fqi "VisaWatch" /tmp/home.html
          grep -Fqi "Detection is not confirmation" /tmp/home.html
          grep -Fqi "Client document checklist" /tmp/home.html
          grep -Fqi "Next follow-up date" /tmp/home.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors "$BASE/dubai-budget.html" -o /tmp/dubai-budget.html
          grep -Fqi "Dubai Student Budget Calculator" /tmp/dubai-budget.html
          grep -Fqi 'id="caRef"' /tmp/home.html
          grep -Fqi 'id="caAge"' /tmp/home.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors "$BASE/client-guide.html" -o /tmp/client-guide.html
          grep -Fqi "Plan your study abroad journey" /tmp/client-guide.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors "$BASE/country-rules-review.html" -o /tmp/country-rules-review.html\n          grep -Fqi "Country Rules Review" /tmp/country-rules-review.html\n          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors "$BASE/training.html" -o /tmp/training.html
          grep -Fqi "Student Visa Counselling Foundations" /tmp/training.html
          grep -Fqi "Knowledge check" /tmp/training.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors "$BASE/data/sources.json" -o /tmp/sources.json
          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors "$BASE/data/updates.json" -o /tmp/updates.json
          python - <<'PY'
          import json
          from pathlib import Path
          sources = json.loads(Path("/tmp/sources.json").read_text(encoding="utf-8"))
          updates = json.loads(Path("/tmp/updates.json").read_text(encoding="utf-8"))
          assert len(sources.get("sources", [])) >= 8, "Official sources list is missing or incomplete"
          assert updates.get("generated_at"), "Monitoring data has no generated_at timestamp"
          assert updates.get("items"), "Monitoring data has no source results"
          print("PASS: live homepage, counsellor training, official sources and monitoring data.")
          PY
