name: VisaWatch Live Website Smoke Test

on:
  workflow_run:
    workflows: ["VisaWatch Cloudflare Deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke-test:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check live website and JSON endpoints
        run: |
          set -euo pipefail
          BASE="https://visa-watch.supunchandimal08.workers.dev"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors "$BASE/" -o /tmp/home.html
          for expected in "VisaWatch" "Detection is not confirmation" "Client document checklist" "Next follow-up date" 'id="caRef"' 'id="caAge"'; do
            grep -Fqi "$expected" /tmp/home.html || { echo "FAIL: homepage missing $expected"; exit 1; }
          done
          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors "$BASE/training.html" -o /tmp/training.html
          grep -Fqi "Student Visa Counselling Foundations" /tmp/training.html
          grep -Fqi "Knowledge check" /tmp/training.html

          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors "$BASE/client-guide.html" -o /tmp/client-guide.html
          grep -Fqi "Plan your study abroad journey" /tmp/client-guide.html
          grep -Fqi "Clear information. Better decisions." /tmp/client-guide.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors "$BASE/dubai-budget.html" -o /tmp/dubai-budget.html
          grep -Fqi "Dubai Student Budget Calculator" /tmp/dubai-budget.html
          grep -Fqi 'id="ref"' /tmp/dubai-budget.html
          grep -Fqi 'id="age"' /tmp/dubai-budget.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors "$BASE/data/sources.json" -o /tmp/sources.json
          curl --fail --silent --show-error --location --retry 5 --retry-delay 10 --retry-all-errors "$BASE/data/updates.json" -o /tmp/updates.json
          python - <<'PY'
          import json
          from pathlib import Path
          sources = json.loads(Path("/tmp/sources.json").read_text(encoding="utf-8"))
          updates = json.loads(Path("/tmp/updates.json").read_text(encoding="utf-8"))
          assert len(sources.get("sources", [])) >= 8, "Official sources list is incomplete"
          assert updates.get("generated_at"), "Monitoring timestamp is missing"
          assert updates.get("items"), "Monitoring results are empty"
          print("PASS: live homepage, client guide, Dubai budget calculator, training, source registry and monitoring data.")
          PY
