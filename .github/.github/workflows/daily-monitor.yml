.github/workflows/daily-monitor.
name: VisaWatch Daily Monitoring

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run immigration monitor
        run: python scripts/monitor.py

      - name: Commit monitoring results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitor_state.json data/updates.json
          git diff --cached --quiet || git commit -m "Update VisaWatch monitoring results"
          git push
yml
